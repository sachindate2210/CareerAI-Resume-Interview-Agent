[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
norecursedirs = .venv pgsql-portable .pgdata storage
markers =
    integration: requires a reachable Postgres database (set DATABASE_URL); skipped otherwise.
    llm: makes real calls to the Anthropic API (costs money); requires ANTHROPIC_API_KEY, skipped otherwise.
